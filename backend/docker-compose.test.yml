services:
  postgres-test:
      image: postgres
      container_name: transaction-app-testdb
      ports:
        - 5433:5432
      environment:
        POSTGRES_PASSWORD: mysecretpassword
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres_test
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
